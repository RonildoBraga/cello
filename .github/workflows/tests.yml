name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pitch-package:
    name: Pitch package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh package

  unit:
    name: App unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: bash scripts/test.sh unit-core

  # Every melody's rendered examples, scored clean and under hiss: the slowest unit tests,
  # in their own job so the app unit tests keep well inside their limit. With ten levels
  # this job took 18 to 26 minutes on GitHub's runners, so it gets more room than the rest.
  examples:
    name: Melody examples
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: bash scripts/test.sh examples

# The real-clock UI tests stay a local, pre-release step: scripts/test.sh ui
